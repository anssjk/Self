<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>King Panel — Console</title>
<style>
/* ============================================================
   King Panel — "Precision Console"
   A restrained, information-dense admin surface in the spirit of
   Linear / Vercel / Stripe dashboards.
   Every functional hook (classes, data-attributes, CSS vars) kept.
   ============================================================ */

:root{
  --a:#6d5efc; --a2:#22d3ee;
  --r:16px; --fs:15px; --bl:18px; --pad:18px; --avr:14px;
  --gl:.4; --sw:2;
  --ff:Vazirmatn,system-ui,Tahoma,sans-serif;
  --r1:calc(var(--r)*.5);
  --r2:calc(var(--r)*.72);
  --r3:calc(var(--r)*.95);
  --sh1:0 1px 2px rgba(9,11,20,.06);
  --sh2:0 1px 2px rgba(9,11,20,.05),0 10px 28px -14px rgba(9,11,20,.24);
  --sh3:0 34px 84px -26px rgba(3,5,14,.62);
  --ease:cubic-bezier(.22,.9,.28,1);
  --ring:0 0 0 3px color-mix(in srgb,var(--a) 18%,transparent);
  --sbw:248px;
  --surf:#0a0c11;
  /* dark defaults so nothing is ever undefined before JS applies a theme */
  --bg:#08090d; --c:#0e1017; --c2:#151821;
  --t:#e8ebf2; --m:#8b93a7; --b:#1e222c; --in:#0b0d13;
  --hi:rgba(255,255,255,.045);
}

[data-t=dark]{
  --bg:#08090d; --c:#0e1017; --c2:#151821;
  --t:#e8ebf2; --m:#8b93a7; --b:#1e222c; --in:#0b0d13;
  --hi:rgba(255,255,255,.045); --surf:#0a0c11;
}
[data-t=light]{
  --bg:#f7f8fa; --c:#ffffff; --c2:#f4f5f8;
  --t:#0d1117; --m:#5b6478; --b:#e3e6ec; --in:#f7f8fa;
  --hi:rgba(255,255,255,.9); --surf:#ffffff;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::selection{background:color-mix(in srgb,var(--a) 62%,transparent);color:#fff}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--m) 34%,transparent) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--m) 30%,transparent);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--m) 52%,transparent);background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}

html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--t);
  font-family:var(--ff);font-size:var(--fs);line-height:1.6;
  min-height:100vh;padding:0 0 128px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-feature-settings:"ss01","cv01","tnum" 0;
  transition:background .35s var(--ease),color .25s;
}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none}

/* ---------- background variants ---------- */
body[data-bg=gradient]::before{
  inset:0;
  background:
    radial-gradient(920px 480px at 90% -20%,color-mix(in srgb,var(--a) 15%,transparent),transparent 62%),
    radial-gradient(720px 440px at -10% 110%,color-mix(in srgb,var(--a2) 9%,transparent),transparent 60%);
}
body[data-bg=mesh]::before{
  inset:0;
  background:
    radial-gradient(520px 320px at 4% 2%,color-mix(in srgb,var(--a) 16%,transparent),transparent),
    radial-gradient(520px 320px at 96% 14%,color-mix(in srgb,var(--a2) 13%,transparent),transparent),
    radial-gradient(680px 420px at 50% 108%,color-mix(in srgb,var(--a) 11%,transparent),transparent);
}
body[data-bg=aurora]::before,body[data-bg=aurora]::after{
  width:66vmax;height:66vmax;border-radius:50%;filter:blur(120px);opacity:.22;
}
body[data-bg=aurora]::before{background:var(--a);top:-30vmax;right:-20vmax;animation:fl 22s ease-in-out infinite alternate}
body[data-bg=aurora]::after{background:var(--a2);bottom:-34vmax;left:-24vmax;animation:fl 28s ease-in-out infinite alternate-reverse}
@keyframes fl{to{transform:translate(7vmax,5vmax) scale(1.12)}}
body[data-bg=grid]::before{
  inset:0;
  background:
    linear-gradient(var(--b) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,var(--b) 1px,transparent 1px) 0 0/40px 40px,
    radial-gradient(720px 460px at 50% -14%,color-mix(in srgb,var(--a) 12%,transparent),transparent);
  mask-image:radial-gradient(ellipse at 50% 0,#000 26%,transparent 74%);
}
body[data-an=off] *,body[data-an=off]::before,body[data-an=off]::after{animation:none!important;transition:none!important}

/* ---------- card surface variants ---------- */
body[data-cs=glass] .card{
  background:color-mix(in srgb,var(--c) 74%,transparent);
  -webkit-backdrop-filter:blur(var(--bl)) saturate(1.4);
  backdrop-filter:blur(var(--bl)) saturate(1.4);
}
body[data-cs=solid] .card{background:var(--c2);backdrop-filter:none;-webkit-backdrop-filter:none}
body[data-cs=outline] .card{background:transparent;border:1px solid color-mix(in srgb,var(--a) 42%,var(--b));backdrop-filter:none}
body[data-cs=neon] .card{box-shadow:0 0 0 1px color-mix(in srgb,var(--a) 34%,transparent),0 0 26px -6px color-mix(in srgb,var(--a) 30%,transparent);border-color:color-mix(in srgb,var(--a) 40%,transparent)}
body[data-d=compact]{--pad:12px}
body[data-d=roomy]{--pad:24px}
body[data-ly=grid] #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
body[data-ly=grid] .u{margin:0}

/* ---------- layout shell ---------- */
.w{max-width:1140px;margin:0 auto;padding:0 18px}

header{
  position:sticky;top:0;z-index:15;
  display:flex;align-items:center;gap:12px;
  margin:0 -18px 18px;padding:12px 18px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  backdrop-filter:blur(20px) saturate(1.5);
  border-bottom:1px solid var(--b);
}
header h1{
  flex:1;min-width:0;margin:0;font-size:15px;font-weight:700;
  letter-spacing:-.015em;display:flex;align-items:center;gap:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
header h1 .si{color:var(--a);width:1.15em;height:1.15em}
header h1 .tic{display:inline-flex;align-items:center;flex:none;line-height:0}
header h1 .tic svg{width:18px;height:18px}
header h1 .tt{overflow:hidden;text-overflow:ellipsis}

.tbar{display:flex;gap:4px;align-items:center;flex:none}
.brand{flex:none;display:grid;place-items:center;width:38px;height:38px;margin-inline-end:2px}
.brand svg{width:34px;height:34px;filter:drop-shadow(0 4px 12px color-mix(in srgb,var(--a) 34%,transparent))}
.tb{
  flex:none;width:34px;height:34px;border-radius:var(--r1);
  border:1px solid transparent;background:transparent;color:var(--m);
  display:grid;place-items:center;cursor:pointer;padding:0;text-decoration:none;
  font-size:15px;line-height:1;
  transition:background .16s,color .16s,border-color .16s,transform .12s var(--ease);
}
.tb .si{width:17px;height:17px;margin:0}
.tb:hover{background:var(--c2);border-color:var(--b);color:var(--t)}
.tb:active{transform:scale(.94)}
.tb.red{color:#e06a6f}
.tb.red:hover{background:#e5484d14;border-color:#e5484d2e;color:#ff8f8f}
.tb.tgb{color:#3aa9e0}
.tb.tgb:hover{background:#29a9eb14;border-color:#29a9eb2e;color:#5cc4f5}

/* ---------- cards ---------- */
.card{
  position:relative;
  background:var(--c);
  border:1px solid var(--b);
  border-radius:var(--r2);
  box-shadow:var(--sh1);
  transition:transform .26s var(--ease),box-shadow .26s var(--ease),border-color .26s;
}
.card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  opacity:0;transition:opacity .4s;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--a) 10%,transparent),transparent 66%);
}
body[data-sp="1"] .card:hover::after{opacity:1}
body[data-bd=gradient] .card::before,body[data-bd=animated] .card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--a),var(--a2),var(--a));background-size:300% 300%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
body[data-bd=animated] .card::before{animation:bd 6s linear infinite}
@keyframes bd{to{background-position:300% 0}}

/* ---------- page header band ---------- */
.dh{
  position:relative;overflow:visible;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 0 15px;border-radius:0;margin:0 0 18px;
  background:none;border:0;border-bottom:1px solid var(--b);
  box-shadow:none;
}
.dh::before{content:none}
.dtl{position:relative;display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:-.025em}
.dtl .si{width:21px;height:21px;margin:0;color:var(--a)}
.dots{display:flex;gap:5px;margin-inline-start:6px;opacity:.55}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--m)}
.dots i:nth-child(2){background:color-mix(in srgb,var(--a) 80%,var(--m))}
.dots i:nth-child(3){background:color-mix(in srgb,var(--a2) 80%,var(--m))}
.rf{
  position:relative;display:inline-flex;align-items:center;gap:7px;flex:none;
  height:34px;padding:0 14px;border-radius:var(--r1);border:1px solid var(--b);
  background:var(--c);color:var(--t);font-family:inherit;font-size:12.5px;font-weight:600;
  cursor:pointer;transition:background .16s,border-color .16s,transform .12s var(--ease),box-shadow .16s;
  box-shadow:var(--sh1);
}
.rf:hover{background:var(--c2);border-color:color-mix(in srgb,var(--a) 34%,var(--b));transform:translateY(-1px)}
.rf:active{transform:scale(.97)}

/* ---------- stat cards ---------- */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:700px){.dg{grid-template-columns:repeat(4,1fr)}}
.dc{
  --acc:var(--a);
  overflow:hidden;min-height:148px;padding:16px 16px 14px;border-radius:var(--r2);
  display:flex;flex-direction:column;box-shadow:var(--sh1);
  background:var(--c);
}
.dg .dc:nth-child(1){--acc:var(--a)}
.dg .dc:nth-child(2){--acc:var(--a2)}
.dg .dc:nth-child(3){--acc:#22c55e}
.dg .dc:nth-child(4){--acc:#f59e0b}
.dc .dt{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:11.5px;font-weight:600;color:var(--m);letter-spacing:.01em;
}
.dc .dt .si{width:16px;height:16px;margin:0;color:color-mix(in srgb,var(--acc) 70%,var(--m))}
.dc .dv{
  margin-top:auto;display:flex;align-items:baseline;gap:6px;
  font-size:31px;font-weight:700;line-height:1.05;direction:ltr;justify-content:flex-end;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums;
}
.dc .dv b{
  background:linear-gradient(180deg,var(--t) 30%,color-mix(in srgb,var(--t) 66%,var(--acc)));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.dc .dv small{font-size:12.5px;color:var(--m);font-weight:600;letter-spacing:0}
.dc .ds{margin-top:9px;font-size:11.5px;color:var(--m);position:relative;z-index:1;min-height:30px;line-height:1.5}
.dc em{
  position:absolute;left:8px;bottom:-14px;font-style:normal;font-size:64px;font-weight:800;
  line-height:1;opacity:.028;pointer-events:none;direction:ltr;letter-spacing:-.06em;
}
.dc .eb{
  position:absolute;inset-inline:0;top:0;height:2px;
  background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 20%,transparent) 62%,transparent);
}
body[data-hv=lift] .u:hover{transform:translateY(-2px);box-shadow:0 16px 36px -18px color-mix(in srgb,var(--a) calc(var(--gl)*70%),transparent)}
body[data-hv=glow] .u:hover{box-shadow:0 0 calc(8px + var(--gl)*26px) color-mix(in srgb,var(--a) calc(var(--gl)*65%),transparent)}

/* ---------- core status ---------- */
.cs{border-radius:var(--r2);padding:18px 18px 14px;margin-top:14px;box-shadow:var(--sh1)}
.cs h3{display:flex;align-items:center;gap:9px;margin:0 0 4px;font-size:14.5px;font-weight:700;letter-spacing:-.015em}
.cs h3 .si{width:18px;height:18px;margin:0;color:var(--a)}
.kv{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:10px 0;border-bottom:1px solid var(--b);font-size:13px;
}
.kv:last-child{border:0;padding-bottom:2px}
.kv span{color:var(--m);flex:none;font-size:12px}
.kv b{
  direction:ltr;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-weight:500;text-align:left;word-break:break-all;font-size:12px;
  color:var(--t);
}

/* ---------- quick actions ---------- */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.qb{
  display:flex;align-items:center;justify-content:flex-start;gap:9px;
  min-height:42px;padding:10px 12px;border-radius:var(--r1);border:1px solid var(--b);
  background:var(--c);color:var(--t);font-family:inherit;font-size:12.5px;font-weight:600;
  cursor:pointer;text-align:start;
  transition:background .16s,border-color .16s,transform .12s var(--ease),box-shadow .16s;
}
.qb:hover{background:var(--c2);border-color:color-mix(in srgb,var(--a) 30%,var(--b));transform:translateY(-1px);box-shadow:var(--sh1)}
.qb:active{transform:scale(.98)}
.qb .si{width:16px;height:16px;margin:0;color:var(--a)}
.qb.pri{
  width:100%;margin-top:8px;min-height:44px;justify-content:center;font-size:13.5px;font-weight:700;
  border:1px solid color-mix(in srgb,var(--a) 60%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--a) 92%,#fff),var(--a));color:#fff;
  box-shadow:0 8px 20px -12px color-mix(in srgb,var(--a) 90%,transparent),inset 0 1px 0 rgba(255,255,255,.18);
}
.qb.pri .si{color:#fff}
.qb.pri:hover{filter:brightness(1.07);transform:translateY(-1px)}

/* ---------- search + chips ---------- */
.bar{display:flex;gap:8px;margin:0 0 12px}
input,select,textarea{
  width:100%;height:40px;padding:0 12px;border-radius:var(--r1);border:1px solid var(--b);
  background:var(--c);color:var(--t);font-size:13.5px;font-family:inherit;
  transition:border-color .16s,box-shadow .16s,background .16s;
}
textarea{height:auto;padding:10px 12px}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--m) 82%,transparent)}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:color-mix(in srgb,var(--a) 62%,var(--b));
  box-shadow:var(--ring);
}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--m) 50%),linear-gradient(135deg,var(--m) 50%,transparent 50%);background-position:calc(0% + 15px) 50%,calc(0% + 20px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-left:32px}
textarea{resize:vertical;line-height:1.6}
input[type=range]{accent-color:var(--a);height:auto;padding:0;margin-top:10px;background:transparent;border:0;box-shadow:none}
input[type=color]{padding:3px;cursor:pointer;height:40px}
input[type=number]{font-variant-numeric:tabular-nums}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{
  height:30px;padding:0 12px;border-radius:var(--r1);border:1px solid var(--b);
  background:var(--c);color:var(--m);font-size:12px;font-weight:600;
  white-space:nowrap;cursor:pointer;flex:none;display:inline-flex;align-items:center;
  transition:background .16s,color .16s,border-color .16s,transform .12s var(--ease);
}
.chip:hover{color:var(--t);border-color:color-mix(in srgb,var(--a) 30%,var(--b));background:var(--c2)}
.chip:active{transform:scale(.96)}
.chip.on{
  background:color-mix(in srgb,var(--a) 14%,var(--c));color:color-mix(in srgb,var(--a) 88%,var(--t));
  border-color:color-mix(in srgb,var(--a) 46%,var(--b));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 18%,transparent);
}

/* ---------- user cards ---------- */
.u{padding:var(--pad);margin:0 0 12px;border-radius:var(--r2);box-shadow:var(--sh1)}
.top{display:flex;align-items:center;gap:12px}
.av{
  width:40px;height:40px;flex:none;border-radius:var(--avr);
  display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(140deg,var(--a),var(--a2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 12px -6px color-mix(in srgb,var(--a) 70%,transparent);
}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.nm small{display:block;color:var(--m);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.tag{
  font-size:10px;padding:3px 9px;border-radius:99px;font-weight:700;flex:none;
  letter-spacing:.02em;border:1px solid transparent;line-height:1.6;
}
.ok{background:#1fa86a16;color:#2fbf7c;border-color:#1fa86a2e}
.no{background:#e5484d16;color:#e8696e;border-color:#e5484d2e}
.off{background:color-mix(in srgb,var(--m) 12%,transparent);color:var(--m);border-color:color-mix(in srgb,var(--m) 22%,transparent)}
.tag.ok::before{
  content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:currentColor;margin-inline-end:5px;vertical-align:1px;animation:pd 2s infinite;
}
@keyframes pd{50%{opacity:.28}}

.pb{height:5px;border-radius:99px;background:var(--in);margin:13px 0 8px;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px var(--b)}
.pb div{height:100%;border-radius:99px;transition:width .5s var(--ease)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--m);font-variant-numeric:tabular-nums}
.meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.act{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap}
.btn{
  flex:1;min-width:54px;height:34px;padding:0 8px;border-radius:var(--r1);border:1px solid var(--b);
  background:var(--c);color:var(--t);font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;
  transition:background .16s,border-color .16s,transform .12s var(--ease),filter .16s;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
}
.btn .si{width:14px;height:14px;margin:0}
.btn:hover{background:var(--c2);border-color:color-mix(in srgb,var(--a) 28%,var(--b))}
.btn:active{transform:scale(.96)}
.btn.p{
  background:linear-gradient(180deg,color-mix(in srgb,var(--a) 92%,#fff),var(--a));
  border-color:color-mix(in srgb,var(--a) 60%,transparent);color:#fff;font-weight:700;
  box-shadow:0 6px 16px -10px color-mix(in srgb,var(--a) 90%,transparent),inset 0 1px 0 rgba(255,255,255,.16);
}
.btn.p:hover{filter:brightness(1.07)}
.btn.d{color:#e8696e;border-color:#e5484d2e}
.btn.d:hover{background:#e5484d14}

/* ---------- empty state ---------- */
.empty{text-align:center;color:var(--m);padding:52px 16px}
.empty .si{width:44px;height:44px;color:color-mix(in srgb,var(--m) 70%,transparent);stroke-width:1.3;margin-bottom:6px}
.empty p{margin:8px 0 16px;font-size:13px}

/* ---------- bottom nav / desktop rail ---------- */
.bn{
  position:fixed;z-index:30;left:50%;transform:translateX(-50%);
  bottom:calc(12px + env(safe-area-inset-bottom));
  width:min(540px,calc(100% - 24px));
  display:flex;gap:3px;padding:5px;border-radius:var(--r3);
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  border:1px solid var(--b);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:0 18px 44px -18px rgba(0,0,0,.6),inset 0 1px 0 var(--hi);
}
.nb{
  flex:1;border:0;background:transparent;color:var(--m);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px;border-radius:var(--r2);font-family:inherit;font-size:10.5px;font-weight:600;
  cursor:pointer;transition:background .2s,color .2s,transform .12s var(--ease);
}
.nb .si{width:19px;height:19px;margin:0}
.nb:active{transform:scale(.95)}
.nb.on{
  background:color-mix(in srgb,var(--a) 14%,transparent);color:color-mix(in srgb,var(--a) 90%,var(--t));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 22%,transparent);
}

/* ---------- fab ---------- */
.fab{
  position:fixed;z-index:25;right:auto;left:18px;
  bottom:calc(96px + env(safe-area-inset-bottom));
  height:46px;padding:0 18px;border-radius:99px;border:1px solid color-mix(in srgb,var(--a) 60%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--a) 92%,#fff),var(--a));color:#fff;
  font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 12px 28px -12px color-mix(in srgb,var(--a) 90%,transparent);
  display:none;align-items:center;gap:7px;
  transition:transform .14s var(--ease),filter .16s;
}
.fab:active{transform:scale(.96)}
.fab:hover{filter:brightness(1.07)}
body[data-v=users] .fab{display:flex}

/* ---------- views ---------- */
.view{display:none;animation:vin .3s var(--ease)}
body[data-v=dash] #v-dash,body[data-v=users] #v-users,body[data-v=scan] #v-scan,body[data-v=loc] #v-loc,body[data-v=mgmt] #v-mgmt{display:block}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}

/* ---------- modals ---------- */
.mo{
  position:fixed;inset:0;background:rgba(4,6,14,.6);
  display:none;align-items:flex-end;justify-content:center;z-index:20;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.mo.on{display:flex}
.sh{
  position:relative;
  width:min(560px,100%);max-height:92vh;overflow:auto;
  background:var(--bg);border:1px solid var(--b);
  border-radius:var(--r3) var(--r3) 0 0;
  padding:22px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:var(--sh3);
}
.sh::before{
  content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:38px;height:4px;border-radius:99px;background:var(--b);
}
@media(min-width:640px){
  .mo{align-items:center}
  .sh{border-radius:var(--r2);padding-top:24px}
  .sh::before{display:none}
}
.mo.on .sh{animation:shu .34s var(--ease)}
@keyframes shu{from{transform:translateY(30px) scale(.985);opacity:0}}
.sh h3{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mh h3{margin:0}
.mh small{color:var(--m);font-size:11.5px}
.mi{
  width:40px;height:40px;flex:none;border-radius:var(--r1);display:grid;place-items:center;
  font-size:18px;color:#fff;background:linear-gradient(140deg,var(--a),var(--a2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
}
.mi .si{width:19px;height:19px;margin:0}
.x{
  margin-inline-start:auto;width:32px;height:32px;flex:none;border-radius:var(--r1);
  border:1px solid var(--b);background:var(--c);color:var(--m);
  cursor:pointer;font-size:14px;display:grid;place-items:center;padding:0;
  transition:background .16s,transform .12s var(--ease),color .16s;
}
.x:hover{background:#e5484d14;color:#e8696e;border-color:#e5484d2e}
.x:active{transform:scale(.94)}
.x .si{width:14px;height:14px;margin:0}

label{display:block;font-size:11px;font-weight:700;color:var(--m);margin:13px 0 5px;letter-spacing:.02em}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.sec{
  border:1px solid var(--b);background:var(--c);border-radius:var(--r2);
  padding:14px 14px;margin:11px 0;
}
.sec h4{margin:0 0 9px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
.sec h4 .si{width:15px;height:15px;margin:0;color:var(--a)}
.sumc{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px;
  border-radius:var(--r2);border:1px solid var(--b);
  background:var(--c2);
}
.sumc div{text-align:center;min-width:0}
.sumc b{display:block;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.sumc small{color:var(--m);font-size:10px;display:block;margin-top:2px}
.sumc .wide{grid-column:1/-1;border-top:1px solid var(--b);padding-top:9px;margin-top:2px}
.sumc .wide small{font-size:11px}

.ptiles,.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pt,.tp{
  padding:11px;border:1px solid var(--b);border-radius:var(--r1);cursor:pointer;
  background:var(--c);transition:border-color .16s,background .16s,transform .12s var(--ease);
  position:relative;
}
.pt b,.tp b{display:block;font-size:12px;font-weight:650}
.pt small,.tp small{color:var(--m);font-size:10px;display:block;margin-top:2px;line-height:1.45}
.pt:hover,.tp:hover{border-color:color-mix(in srgb,var(--a) 34%,var(--b));background:var(--c2)}
.pt:active,.tp:active{transform:scale(.98)}
.pt.on{border-color:color-mix(in srgb,var(--a) 60%,var(--b));background:color-mix(in srgb,var(--a) 10%,var(--c))}
.pt.on::after{
  content:"✓";position:absolute;top:6px;left:8px;color:var(--a);font-weight:900;font-size:11px;
}
.tp{background:var(--c2)}
.lk2{
  padding:14px 6px;border-radius:var(--r1);color:#fff;font-weight:700;text-align:center;
  cursor:pointer;font-size:11.5px;text-shadow:0 1px 6px rgba(0,0,0,.4);
  transition:transform .16s var(--ease),filter .16s,box-shadow .16s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
}
.lk2:hover{transform:translateY(-1px);filter:brightness(1.08)}
.lk2:active{transform:scale(.97)}

.rw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.sw2{
  width:42px;height:24px;border-radius:99px;background:var(--in);
  border:1px solid var(--b);position:relative;cursor:pointer;flex:none;transition:background .22s,border-color .22s;
}
.sw2 i{
  position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:left .22s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.sw2.on{background:var(--a);border-color:transparent}
.sw2.on i{left:21px}

.big{font-size:20px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stk{
  position:sticky;bottom:-18px;margin:14px -18px -18px;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 40%);
  display:flex;gap:7px;
}
.stk .btn{height:42px;font-size:13.5px;border-radius:var(--r1)}

.gp{border:1px solid var(--b);border-radius:var(--r2);padding:2px 14px 12px;margin:10px 0;background:var(--c)}
.gp summary{
  cursor:pointer;padding:12px 0;font-weight:650;font-size:12.5px;list-style:none;
  display:flex;align-items:center;gap:8px;
}
.gp summary::-webkit-details-marker{display:none}
.gp summary::after{content:"⌄";margin-inline-start:auto;color:var(--m);transition:transform .22s;font-size:15px;line-height:1}
.gp[open] summary::after{transform:rotate(180deg)}

.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sw span{
  width:32px;height:32px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:transform .14s var(--ease),border-color .16s;
  box-shadow:0 1px 4px rgba(0,0,0,.25);
}
.sw span:hover{transform:scale(1.08)}
.sw span.on{border-color:var(--t)}

#qr{display:grid;place-items:center;padding:12px;background:#fff;border-radius:var(--r2);margin:10px auto;width:fit-content;box-shadow:var(--sh2)}
.lk{
  font-size:10.5px;word-break:break-all;color:var(--m);background:var(--in);
  padding:10px 11px;border-radius:var(--r1);margin-top:8px;direction:ltr;text-align:left;
  font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:170px;overflow:auto;
  border:1px solid var(--b);
}
.ipl{max-height:250px;overflow:auto;border:1px solid var(--b);border-radius:var(--r1);padding:2px 11px;background:var(--in);margin-bottom:10px}
.ipl .rw{border-bottom:1px solid var(--b);padding:8px 0;font-size:12px}
.ipl .rw:last-child{border:0}

/* ---------- alerts ---------- */
.ats{display:none;margin-top:8px;padding:10px 13px;border-radius:var(--r1);font-size:12px;line-height:1.65;border:1px solid transparent}
.ats.ok,.ats.bad,.ats.warn,.ats.run{display:block}
.ats.ok{background:#1fa86a14;color:#2fbf7c;border-color:#1fa86a2e}
.ats.bad{background:#e5484d14;color:#e8696e;border-color:#e5484d2e}
.ats.warn{background:#f59e0b14;color:#d99a2b;border-color:#f59e0b2e}
.ats.run{background:var(--in);color:var(--m);border-color:var(--b)}
.fok{outline:2px solid #22c55e!important;outline-offset:-1px}
.fbad{outline:2px solid #ef4444!important;outline-offset:-1px}

/* ---------- toast ---------- */
#toast{
  position:fixed;top:16px;left:50%;z-index:50;
  transform:translateX(-50%) translateY(-140px);
  background:var(--c);color:var(--t);
  border:1px solid var(--b);
  padding:10px 18px;border-radius:99px;font-size:12.5px;font-weight:600;
  box-shadow:0 16px 40px -14px rgba(0,0,0,.55),inset 0 1px 0 var(--hi);
  transition:transform .34s var(--ease);max-width:calc(100% - 32px);text-align:center;
}
#toast.on{transform:translateX(-50%) translateY(0)}

/* ---------- icons ---------- */
.si{width:1em;height:1em;vertical-align:-.16em;stroke-width:var(--sw,2);margin-inline-end:.3em;flex:none}
.ic .si,.x .si,.mi .si,.st .si,.empty .si,.tag .si,.tb .si,.nb .si,.qb .si,.btn .si{margin:0}
.ie{display:inline-flex;align-items:center;vertical-align:-.15em}
.ic{display:inline-grid;place-items:center;text-decoration:none;padding:0;width:38px;height:38px;border-radius:var(--r1);border:1px solid var(--b);background:var(--c);color:var(--t);font-size:17px;cursor:pointer}
.ic .si{color:var(--t)}
a.ic.tg{border-color:#29a9eb66;background:color-mix(in srgb,#29a9eb 12%,var(--c))}

/* ---------- entrance animations ---------- */
@keyframes fu{from{opacity:0;transform:translateY(14px)}}
@keyframes sl{from{opacity:0;transform:translateX(-20px)}}
@keyframes pp{from{opacity:0;transform:scale(.94)}}
body[data-en=fade] .ani{animation:fu .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
body[data-en=slide] .ani{animation:sl .46s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
body[data-en=pop] .ani{animation:pp .4s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i,0)*40ms)}

/* ---------- title / button style variants ---------- */
body[data-tf=gradient] .tt,body[data-tf=animated] .tt{
  background:linear-gradient(90deg,var(--a),var(--a2),var(--a));background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
body[data-tf=animated] .tt{animation:tx 6s linear infinite}
@keyframes tx{to{background-position:200% center}}
body[data-bt=solid] .btn.p,body[data-bt=solid] .fab,body[data-bt=solid] .chip.on,body[data-bt=solid] .nb.on,body[data-bt=solid] .qb.pri{background:var(--a);background-image:none}
body[data-bt=pill] .btn,body[data-bt=pill] .fab,body[data-bt=pill] .chip,body[data-bt=pill] .ic,body[data-bt=pill] .tb{border-radius:99px}
body[data-bt=outline] .btn.p,body[data-bt=outline] .fab,body[data-bt=outline] .chip.on,body[data-bt=outline] .qb.pri{
  background:transparent;background-image:none;color:var(--a);border:1px solid color-mix(in srgb,var(--a) 60%,transparent);box-shadow:none;
}
body[data-bt=outline] .btn.p .si,body[data-bt=outline] .qb.pri .si{color:var(--a)}

/* ---------- fx canvas + grain ---------- */
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
#grain{
  position:fixed;inset:0;pointer-events:none;z-index:70;opacity:.05;mix-blend-mode:overlay;display:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
body[data-ns="1"] #grain{display:block}

/* ---------- misc ---------- */
.wrap{flex-wrap:wrap}
#mc{z-index:40}
.st{padding:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}

/* ---------- role badge (admin crown / user figure) ---------- */
.rbadge{
  flex:none;display:inline-flex;align-items:center;gap:5px;
  height:22px;padding:0 9px;border-radius:99px;
  font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid color-mix(in srgb,var(--a) 34%,var(--b));
  background:color-mix(in srgb,var(--a) 12%,transparent);
  color:color-mix(in srgb,var(--a) 88%,var(--t));
  white-space:nowrap;
}
.rbadge.usr{
  border-color:color-mix(in srgb,var(--m) 30%,var(--b));
  background:color-mix(in srgb,var(--m) 10%,transparent);
  color:var(--m);
}
.brand svg{transition:filter .2s}
body[data-role=user] .brand svg{filter:drop-shadow(0 4px 12px color-mix(in srgb,var(--m) 30%,transparent))}

/* ---------- management grid ---------- */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1024px){.mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mtile{
  position:relative;display:flex;flex-direction:column;gap:7px;
  padding:14px 13px;border-radius:var(--r2);
  border:1px solid var(--b);background:var(--c);
  cursor:pointer;text-align:start;font-family:inherit;color:var(--t);
  transition:border-color .16s,background .16s,transform .14s var(--ease),box-shadow .16s;
  overflow:hidden;
}
.mtile::after{
  content:"";position:absolute;inset-inline-end:-18px;top:-18px;
  width:64px;height:64px;border-radius:50%;
  background:color-mix(in srgb,var(--a) 10%,transparent);
  opacity:0;transition:opacity .2s;
}
.mtile:hover{border-color:color-mix(in srgb,var(--a) 34%,var(--b));background:var(--c2);transform:translateY(-2px);box-shadow:var(--sh2)}
.mtile:hover::after{opacity:1}
.mtile:active{transform:translateY(0) scale(.985)}
.mtile .mic{
  width:32px;height:32px;flex:none;border-radius:var(--r1);
  display:grid;place-items:center;font-size:15px;
  background:color-mix(in srgb,var(--a) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--a) 20%,transparent);
}
.mtile b{font-size:12.5px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.mtile small{font-size:10.5px;color:var(--m);line-height:1.45}
.mtile.danger .mic{background:#e5484d14;border-color:#e5484d2e}
.mtile.danger:hover{border-color:#e5484d40}
.mtile.danger b{color:#e8696e}
.mnote{
  display:flex;gap:9px;align-items:flex-start;
  padding:11px 13px;border-radius:var(--r1);
  border:1px solid color-mix(in srgb,var(--a) 22%,var(--b));
  background:color-mix(in srgb,var(--a) 7%,transparent);
  font-size:11.5px;color:var(--m);line-height:1.6;margin-top:12px;
}
.mnote b{color:var(--t);font-weight:700}

/* ============================================================
   DESKTOP — professional sidebar shell
   ============================================================ */
@media(min-width:1024px){
  body{padding:0 0 40px}
  .w{
    max-width:1200px;
    padding-inline-start:calc(var(--sbw) + 36px);
    padding-inline-end:36px;
    padding-top:0;
  }
  header{
    margin:0 0 20px;padding:14px 0;
    background:transparent;
    -webkit-backdrop-filter:none;backdrop-filter:none;
    border-bottom:1px solid var(--b);
  }
  header h1{font-size:16px}
  .tbar{gap:6px}
  .tb{width:34px;height:34px;border:1px solid var(--b);background:var(--c)}
  .tb:hover{background:var(--c2)}

  .bn{
    left:auto;right:auto;transform:none;
    inset-inline-start:0;top:0;bottom:0;
    width:var(--sbw);height:100vh;
    flex-direction:column;justify-content:flex-start;gap:2px;
    padding:18px 12px;
    border-radius:0;
    border:0;border-inline-end:1px solid var(--b);
    background:var(--surf);
    -webkit-backdrop-filter:none;backdrop-filter:none;
    box-shadow:none;
  }
  .bn::before{
    content:"Navigation";
    display:block;width:100%;
    padding:0 10px 10px;
    font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:color-mix(in srgb,var(--m) 80%,transparent);
  }
  .bn::after{content:none}
  .nb{
    flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:10px;
    padding:9px 10px;border-radius:var(--r1);font-size:13px;font-weight:600;
    position:relative;width:100%;
  }
  .nb .si{width:17px;height:17px}
  .nb:hover{background:var(--c2);color:var(--t)}
  .nb.on{
    background:color-mix(in srgb,var(--a) 12%,transparent);
    color:color-mix(in srgb,var(--a) 88%,var(--t));
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 20%,transparent);
  }
  .nb.on::before{
    content:"";position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);
    width:2px;height:16px;border-radius:0 2px 2px 0;
    background:var(--a);
  }
  .nb.on .si{color:var(--a)}

  .fab{display:none!important}
  .dg{gap:14px}

  /* two-column content: core status + quick actions side by side */
  body[data-v=dash] #v-dash{
    display:grid;grid-template-columns:1.1fr .9fr;
    gap:16px 16px;align-items:start;

 if(!b.protos.length)return toast('⚠️ Select at least one protocol');

 const r=await api(E?'PUT':'POST',E?'/api/users/'+editId:'/api/users',b);
 if(r.detail)return toast('⚠️ '+r.detail);
 cl('mu');if(E)users=users.map(x=>x.id===r.user.id?r.user:x);else users=[...r.users,...users];

async function up(i,b){const u=users.find(x=>x.id===i);if(!u)return;const old={...u};
 if('enabled' in b){u.enabled=b.enabled;u.active=b.enabled&&u.active}if(b.reset){u.up=u.down=0}render();
 const r=await api('PUT','/api/users/'+i,b);if(r.detail){Object.assign(u,old);render();return toast('⚠️ '+r.detail)}
 users=users.map(x=>x.id===i?r.user:x);render();stats(r.stats)}

function roleOf(){
  const q=new URLSearchParams(location.search).get('role');
  if(q==='user'||q==='admin')return q;
  const m=ME||{};
  if(typeof m.is_admin==='boolean')return m.is_admin?'admin':'user';
  if(typeof m.admin==='boolean')return m.admin?'admin':'user';
  if(typeof m.isAdmin==='boolean')return m.isAdmin?'admin':'user';
  if(typeof m.role==='string')return /admin|owner|root|super/i.test(m.role)?'admin':'user';
  return 'admin';
}
function applyRole(){
  const r=roleOf(),admin=r==='admin';
  document.body.dataset.role=r;
  const b=$('roleBadge');
  if(b){b.className='rbadge'+(admin?'':' usr');b.textContent=admin?'👑 ADMIN':'👤 USER';}
  const ic=$('brandIc');if(ic)ic.innerHTML=admin?ICON_CROWN:ICON_USER;
  const ti=$('ttlIc');if(ti)ti.innerHTML=admin?ICON_CROWN_S:ICON_USER_S;
  const nb=document.querySelector('.nb[data-v=mgmt]');if(nb)nb.style.display=admin?'':'none';
  if(!admin&&document.body.dataset.v==='mgmt')go('dash');
}

/* ============================================================
   MANAGEMENT — 10 real admin capabilities
   ============================================================ */
const MG=[
  ['👤','ساخت کاربر جدید','پیکربندی کامل یک کاربر تازه با پروتکل، حجم و زمان',()=>{go('users');openUser()}],
  ['🧩','ساخت گروهی کاربر','چند کانفیگ هم‌زمان با یک الگو بساز',()=>{go('users');openUser();setTimeout(()=>{const c=$('fc');if(c){c.value=5;sum()}},60)}],
  ['📥','دانلود همه کانفیگ‌ها','خروجی متنی تمام کانفیگ‌های آی‌پی تمیز',()=>dlAll()],
  ['🔗','کپی لینک اشتراک','لینک ساب اولین کاربر را کپی کن',()=>subFirst()],
  ['🎯','اسکنر آی‌پی تمیز','تست و مرتب‌سازی آی‌پی‌های کلادفلر و دستی',()=>go('scan')],
  ['🌐','چندلوکیشن','افزودن آدرس جایگزین برای همه کاربران',()=>go('loc')],
  ['🎨','استودیوی ظاهر','رنگ، فونت، چیدمان و افکت‌های پنل',()=>openSet()],
  ['💾','پشتیبان‌گیری JSON','دریافت نسخه پشتیبان از کاربران و تنظیمات',()=>backupJSON()],
  ['♻️','ریست مصرف همه','صفر کردن ترافیک مصرفی تمام کاربران',()=>resetAll()],
  ['⏯️','فعال/غیرفعال گروهی','تغییر وضعیت همه کاربران با یک کلیک',()=>toggleAll()]
];
function renderMgmt(){
  if(roleOf()!=='admin'){go('dash');return}
  $('v-mgmt').innerHTML=`${ph('🛡️','مدیریت','<button class="rf" onclick="load()">🔄 بروزرسانی</button>')}
  <div class="card cs"><h3>⚡ قابلیت‌های مدیریتی</h3>
    <div class="mgrid">${MG.map(([i,t,d,fn],k)=>`<button class="mtile${k===8||k===9?' danger':''}" data-mg="${k}"><span class="mic">${i}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div>
    <div class="mnote"><span>ℹ️</span><div>این بخش فقط برای <b>مدیر</b> نمایش داده می‌شود. کاربران عادی همان پنل را با آیکون آدمک و بدون دسترسی مدیریتی می‌بینند.</div></div>
  </div>
  <div class="card cs"><h3>📊 خلاصه وضعیت</h3>
    <div class="kv"><span>نقش فعلی</span><b>👑 مدیر</b></div>
    <div class="kv"><span>تعداد کاربران</span><b>${users.length}</b></div>
    <div class="kv"><span>کاربران فعال</span><b>${users.filter(u=>u.active).length}</b></div>
    <div class="kv"><span>غیرفعال</span><b>${users.filter(u=>!u.enabled).length}</b></div>
    <div class="kv"><span>آی‌پی‌های ذخیره‌شده</span><b>${POOL.cf.ips.length+POOL.cu.ips.length+POOL.warp.ips.length}</b></div>
    <div class="kv"><span>لوکیشن‌ها</span><b>${LOCS.length}</b></div>

  $('v-mgmt').querySelectorAll('.mtile').forEach(el=>{el.onclick=()=>MG[+el.dataset.mg][3]()});
}
function backupJSON(){
  const data={exported:new Date().toISOString(),settings:S,users:users.map(u=>({...u,links:undefined}))};
  const t=JSON.stringify(data,null,2);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));
  a.download='king-panel-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast('✅ نسخه پشتیبان دانلود شد');
}
async function resetAll(){
  if(!users.length)return toast('⚠️ کاربری وجود ندارد');
  if(!(await ask('Reset usage of all '+users.length+' users?','Reset all')))return;
  let n=0;for(const u of users){const r=await api('PUT','/api/users/'+u.id,{reset:true});if(!r.detail){n++;if(r.user)users=users.map(x=>x.id===u.id?r.user:x)}}
  render();toast('✅ مصرف '+n+' کاربر صفر شد');
}
async function toggleAll(){
  if(!users.length)return toast('⚠️ کاربری وجود ندارد');
  const anyOn=users.some(u=>u.enabled),target=!anyOn;
  if(!(await ask((target?'Enable':'Disable')+' all '+users.length+' users?',target?'Enable all':'Disable all')))return;
  let n=0;for(const u of users){const r=await api('PUT','/api/users/'+u.id,{enabled:target});if(!r.detail){n++;if(r.user)users=users.map(x=>x.id===u.id?r.user:x)}}
  render();toast('✅ '+n+' کاربر '+(target?'فعال':'غیرفعال')+' شد');
}
const locText=u=>LOCS.flatMap(L=>u.links.map(x=>withIP(x.l,L.h,L.p))).join('\n');
function addLoc(){const n=$('ln').value.trim(),h=$('lh').value.trim(),p=$('lp').value.trim();if(!h)return toast('⚠️ آدرس یا IP را وارد کنید');LOCS.push({n:n||h,h,p});svl();renderLoc();toast('✅ لوکیشن اضافه شد')}
const delLoc=i=>{LOCS.splice(i,1);svl();renderLoc()};
function exLoc(d){const t=users.map(locText).filter(Boolean).join('\n');if(!t)return toast('⚠️ اول یک لوکیشن اضافه کنید');if(!d)return cp(t);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='multi-location-configs.txt';a.click()}
function renderLoc(){$('v-loc').innerHTML=`${ph('🌐','چندلوکیشن')}
 <div class="sec"><h4>📍 افزودن لوکیشن</h4><div class="row"><input id="ln" placeholder="نام (مثلاً آلمان)"><input id="lh" dir="ltr" placeholder="آدرس یا IP"></div><div class="row" style="margin-top:8px"><input id="lp" dir="ltr" type="number" placeholder="پورت (اختیاری)"><button class="btn p" onclick="addLoc()">＋ افزودن</button></div>
 <small style="color:var(--m);display:block;margin-top:8px">هر لوکیشن یک آدرس جایگزین است و SNI و Host از کانفیگ اصلی حفظ می‌شود. در پنجره‌ی لینک هر کاربر یک تب «چندلوکیشن» اضافه می‌شود.</small></div>
 <div class="sec"><h4>📋 لوکیشن‌ها (${LOCS.length})</h4>${LOCS.length?`<div class="ipl">${LOCS.map((L,i)=>`<div class="rw"><span><b>${esc(L.n)}</b> <small dir="ltr" style="color:var(--m)">${esc(L.h)}${L.p?':'+esc(L.p):''}</small></span><button class="x" style="width:28px;height:28px;margin:0" onclick="delLoc(${i})">✕</button></div>`).join('')}</div>`:'<div class="empty" style="padding:18px 0">هنوز لوکیشنی نیست</div>'}
 <div class="act"><button class="btn p" onclick="exLoc(0)">📋 کپی برای همه کاربران</button><button class="btn" onclick="exLoc(1)">📥 دانلود</button></div></div>`}
function subFirst(){const u=users[0];u?cp(location.origin+'/sub/'+u.token):toast('⚠️ هنوز کاربری ندارید')}
function dashIPs(){if(!$('d4'))return;const A=[...POOL.cf.ips,...POOL.cu.ips],ok=A.filter(x=>x.ms>0);$('d4').textContent=ok.length||A.length;$('d4s').textContent=ok.length?'تست‌شده و سالم · کلودفلر و دستی':A.length?'هنوز تست نشده · کلودفلر و دستی':'از صفحه اسکنر آی‌پی اضافه کنید'}
function stats(s){const cap=ME.max_users||0,t=fb(s.traffic).split(' '),pr=[...new Set(users.flatMap(u=>String(u.protos||'').split(',').filter(Boolean)))].map(p=>PN[p]||p);
 $('d1').textContent=safe(s.active);$('d1u').textContent='/ '+(cap||'∞');$('d1s').textContent=cap?Math.max(0,cap-s.users)+' ظرفیت آزاد':s.users+' کاربر ساخته‌شده';
 $('d2').textContent=t[0];$('d2u').textContent=t[1];
 $('d3').textContent=pr.length?pr.join(' / '):'—';$('d3').style.fontSize=pr.length>1?'22px':'';dashIPs();
 const ram=s.ram_total?Math.round(s.ram_used/s.ram_total*100)+'% · '+s.load.toFixed(2):'–',st=s.xray_err?s.xray_err:s.applying?'در حال اعمال تغییرات':'سالم';
 $('core').innerHTML=[['موتور پروکسی','VLESS / Trojan / VMess / HTTPUpgrade'],['وضعیت هسته',st],['رم · بار سرور',ram],['مسیر مدیریت',location.pathname],['سقف کاربران',ME.max_users||'نامحدود'],['سقف حجم',ME.max_gb?ME.max_gb+' GB':'نامحدود'],['آی‌پی‌های ذخیره‌شده',POOL.cf.ips.length+POOL.cu.ips.length+POOL.warp.ips.length],['لوکیشن‌ها',LOCS.length],['مدیر',ME.email||'–']].map(([a,b])=>`<div class="kv"><span>${a}</span><b>${esc(b)}</b></div>`).join('');
 $('meb').textContent=ME.max_gb?'سهمیه حجم '+fb(users.reduce((a,u)=>a+u.limit_bytes,0))+' از '+ME.max_gb+' GB':'';
 const eb=$('errb');eb.className='ats'+(s.xray_err?' bad':s.applying?' run':'');eb.textContent=s.xray_err||(s.applying?'⏳ Applying changes on the server...':'');
 clearTimeout(LT);if(s.applying)LT=setTimeout(load,1800)}

load();setInterval(()=>{if(!document.hidden)load()},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setTimeout(loadQR,4000);
